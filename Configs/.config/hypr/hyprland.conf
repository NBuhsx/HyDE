# ==============================================================================
#                 ГЛАВНЫЙ ДИСПЕТЧЕР КОНФИГУРАЦИИ HYPRLAND (HyDE)
# ==============================================================================
# Этот файл является точкой входа. Он не содержит прямых настроек, а последовательно
# собирает (линкует) отдельные модули вашей системы с помощью директивы `source`.
# ==============================================================================

# ⌨️ Горячие клавиши и бинды
# Отвечает за запуск терминала, лаунчеров, управление окнами и мультимедиа.
source = ./keybindings.conf

# 🪟 Правила поведения окон (Window Rules)
# Задает параметры float-режима, прозрачность, размытие и привязку приложений к воркспейсам.
source = ./windowrules.conf

# 🖥️ Настройки мониторов и экранов
# Конфигурация разрешений, частоты обновления (Гц), позиционирования и масштабирования.
source = ./monitors.conf

# 🌌 Настройки рабочих пространств (Workspaces)
# Управляет логикой воркспейсов, их именованием, поведением и распределением по мониторам.
source = ./workspaces.conf

# 👤 Личные пользовательские предпочтения (Наивысший приоритет)
# Главный файл для вашей кастомизации. Изменения переменных, раскладки и логики вносятся сюда.
source = ./userprefs.conf
