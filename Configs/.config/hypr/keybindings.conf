# Официальная документация по биндам: https://wiki.hypr.land/configuring/binds/
# Документация по ключевым словам: https://wiki.hypr.land/configuring/keywords/

# ==============================================================================
#                  ЛОГИКА ГРУППИРОВКИ ДЛЯ ИНТЕРФЕЙСА ROFI (HyDE)
# ==============================================================================
# Переменная `$d` собирает бинды в блоки формата: [$wm|Подгруппа1|Подгруппа2]
# Это используется скриптом `keybinds_hint.sh` для отрисовки GUI-шпаргалки.
# Модификаторы биндов HyDE:
# bindd  - Обычное нажатие + Описание (Description)
# bindde - Нажатие с автоповтором (для регулировки громкости/размера окон)
# binddm - Бинды для мыши (перетаскивание/изменение размера)
# binddl - Работает даже на заблокированном экране (мультимедиа)
# ==============================================================================




# ==============================================================================
# 🪟 УПРАВЛЕНИЕ ОКНАМИ (Window Management)
# ==============================================================================
$wm = Управление окнами
$d = [$wm]
bindd = $mainMod, Q, $d Закрыть активное окно, exec, $KILLACTIVE
bindd = Alt, F4, $d Закрыть активное окно (Alt+F4), exec, $KILLACTIVE
bindd = $mainMod, Delete, $d Завершить сессию Hyprland, exec, hyde-shell logout
bindd = $mainMod, W, $d Переключить плавающий режим (Float), togglefloating
bindd = $mainMod, G, $d Переключить режим группы окон, togglegroup
bindd = Shift, F11, $d На весь экран (Fullscreen), fullscreen
bindd = $mainMod, L, $d Заблокировать экран, exec, hyde-shell lock-session
bindd = $mainMod Shift, F, $d Закрепить окно поверх всех рабочих столов, exec, hyde-shell window.pin
bindd = Control Alt, Delete, $d Меню выхода из системы, exec, hyde-shell logoutlaunch
bindd = Alt_R, Control_R, $d Перезапустить Waybar и конфиг, exec, hyde-shell waybar --hide

$d = [$wm|Навигация по группам]
bindd = $mainMod Control, H, $d Предыдущее окно в группе, changegroupactive, b
bindd = $mainMod Control, L, $d Следующее окно в группе, changegroupactive, f

$d = [$wm|Смена фокуса]
bindd = $mainMod, Left, $d Фокус влево, movefocus, l
bindd = $mainMod, Right, $d Фокус вправо, movefocus, r
bindd = $mainMod, Up, $d Фокус вверх, movefocus, u
bindd = $mainMod, Down, $d Фокус вниз, movefocus, d
bindd = ALT, Tab, $d Цикличное переключение окон (Alt+Tab), exec, hyprctl --batch "dispatch cyclenext ; dispatch alterzorder top"


$d = [$wm|Изменение размера окон]
bindde = $mainMod Shift, Right, $d Расширить окно вправо, resizeactive, 30 0
bindde = $mainMod Shift, Left, $d Сжать окно влево, resizeactive, -30 0
bindde = $mainMod Shift, Up, $d Сжать окно вверх, resizeactive, 0 -30
bindde = $mainMod Shift, Down, $d Расширить окно вниз, resizeactive, 0 30


$d = [$wm|Перемещение активного окна]
$moveactivewindow = grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
bindde = $mainMod Shift Control, left, $d Переместить окно влево, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
bindde = $mainMod Shift Control, right, $d Переместить окно вправо, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
bindde = $mainMod Shift Control, up, $d Переместить окно вверх, exec, $moveactivewindow 0 -30 || hyprctl dispatch movewindow u
bindde = $mainMod Shift Control, down, $d Переместить окно вниз, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d


$d = [$wm|Управление мышью]
binddm = $mainMod, mouse:272, $d Зажать для перемещения окна, movewindow
binddm = $mainMod, mouse:273, $d Зажать для изменения размера окна, resizewindow
binddm = $mainMod, Z, $d Зажать для перемещения окна (клавиша Z), movewindow
binddm = $mainMod, X, $d Зажать для изменения размера (клавиша X), resizewindow

$d = [$wm]
bindd = $mainMod, J, $d Переключить разделение окон (Split), layoutmsg, togglesplit

# ==============================================================================
# 🚀 ЗАПУСК ПРИЛОЖЕНИЙ И МЕНЮ ROFI (Launcher)
# ==============================================================================
$l = Запуск приложений
$d = [$l|Программы]

bindd = $mainMod, T, $d Эмулятор терминала, exec, $TERMINAL
bindd = $mainMod Alt, T, $d Выпадающий терминал (Scratchpad), exec, [float; move 20% 5%; size 60% 60%] $TERMINAL
bindd = $mainMod, E, $d Файловый менеджер, exec, $EXPLORER
bindd = $mainMod Shift, C, $d Текстовый редактор, exec, $IDLE
bindd = $mainMod, B, $d Веб-браузер, exec, $BROWSER
bindd = Control Shift, Escape, $d Системный монитор, exec, $scrPath/sysmonlaunch.sh

$rofi-launch = $scrPath/rofilaunch.sh
$d = [$l|Меню Rofi]
bindd = $mainMod, A, $d Меню поиска приложений, exec, pkill -x rofi || $rofi-launch d
bindd = $mainMod, TAB, $d Переключатель активных окон, exec, pkill -x rofi || $rofi-launch w
bindd = $mainMod Shift, E, $d Меню поиска файлов, exec, pkill -x rofi || $rofi-launch f
bindd = $mainMod, slash, $d Показать шпаргалку горячих клавиш, exec, pkill -x rofi || $scrPath/keybinds_hint.sh c
bindd = $mainMod, comma, $d Меню выбора Эмодзи, exec, pkill -x rofi || $scrPath/emoji-picker.sh
bindd = $mainMod, period, $d Меню выбора Глифов (Символов), exec, pkill -x rofi || $scrPath/glyph-picker.sh
bindd = $mainMod, V, $d Буфер обмена (Быстрый выбор), exec, pkill -x rofi || $scrPath/cliphist.sh -c
bindd = $mainMod Shift, V, $d Менеджер истории буфера обмена, exec, pkill -x rofi || $scrPath/cliphist.sh
bindd = $mainMod Shift, A, $d Смена стиля лаунчера Rofi, exec, pkill -x rofi || $scrPath/rofiselect.sh


# ==============================================================================
# 🎛️ УПРАВЛЕНИЕ ОБОРУДОВАНИЕМ (Hardware Controls)
# ==============================================================================
$hc = Контроль железа
$d = [$hc|Звук]

binddl  = , F10, $d Включить/Выключить звук, exec, $scrPath/volumecontrol.sh -o m
binddl  = , XF86AudioMute, $d Включить/Выключить звук, exec, $scrPath/volumecontrol.sh -o m
binddel = , F11, $d Уменьшить громкость, exec, $scrPath/volumecontrol.sh -o d
binddel = , F12, $d Увеличить громкость, exec, $scrPath/volumecontrol.sh -o i
binddl  = , XF86AudioMicMute, $d Включить/Выключить микрофон, exec, $scrPath/volumecontrol.sh -i m
binddel = , XF86AudioLowerVolume, $d Уменьшить громкость, exec, $scrPath/volumecontrol.sh -o d
binddel = , XF86AudioRaiseVolume, $d Увеличить громкость, exec, $scrPath/volumecontrol.sh -o i

$d = [$hc|Медиаплеер]
binddl  = , XF86AudioPlay, $d Воспроизведение / Пауза, exec, playerctl play-pause
binddl  = , XF86AudioPause, $d Пауза, exec, playerctl play-pause
binddl  = , XF86AudioNext, $d Следующий трек, exec, playerctl next
binddl  = , XF86AudioPrev, $d Предыдущий трек, exec, playerctl previous
bindd = $mainMod Control, M, $d Включить/Выключить звук для активного окна, exec, hyde-shell window.mute


$d = [$hc|Яркость экрана]
binddel = , XF86MonBrightnessUp, $d Увеличить яркость монитора, exec, $scrPath/brightnesscontrol.sh i
binddel = , XF86MonBrightnessDown, $d Уменьшить яркость монитора, exec, $scrPath/brightnesscontrol.sh d


# ==============================================================================
# 🛠️ СИСТЕМНЫЕ УТИЛИТЫ (Utilities)
# ==============================================================================
$ut = Утилиты
$d = [$ut]

binddl = $mainMod, K, $d Смена раскладки клавиатуры, exec, $scrPath/keyboardswitch.sh
bindd = $mainMod Alt, G, $d Игровой режим (Отключение эффектов), exec, $scrPath/gamemode.sh
bindd = $mainMod Shift, G, $d Запустить игровой лаунчер (Steam/Lutris), exec, $scrPath/gamelauncher.sh

$d = [$ut|Скриншоты и Запись]
bindd = $mainMod Shift, P, $d Пипетка (Скопировать цвет HEX в буфер), exec, hyprpicker -an
bindd = $mainMod, P, $d Сделать снимок области экрана (Snip), exec, $scrPath/screenshot.sh s
bindd = $mainMod Control, P, $d Снимок области с заморозкой экрана, exec, $scrPath/screenshot.sh sf
binddl = $mainMod Alt, P, $d Снимок текущего монитора, exec, $scrPath/screenshot.sh m
binddl = , Print, $d Снимок всех подключенных мониторов, exec, $scrPath/screenshot.sh p


# ==============================================================================
# 🎨 КАСТОМИЗАЦИЯ И КАЛЕЙДОСКОП ТЕМ (Theming and Wallpaper)
# ==============================================================================
$rice = Кастомизация внешнего вида
$d = [$rice]
bindd = $mainMod Alt, Right, $d Следующие глобальные обои, exec, $scrPath/wallpaper.sh -Gn
bindd = $mainMod Alt, Left, $d Предыдущие глобальные обои, exec, $scrPath/wallpaper.sh -Gp
bindd = $mainMod Shift, W, $d Выбрать глобальные обои из списка Rofi, exec, pkill -x rofi || $scrPath/wallpaper.sh -SG
bindd = $mainMod Alt, Up, $d Следующий стиль панели Waybar, exec, $scrPath/wbarconfgen.sh n
bindd = $mainMod Alt, Down, $d Предыдущий стиль панели Waybar, exec, $scrPath/wbarconfgen.sh p
bindd = $mainMod Shift, R, $d Выбор режима генерации цветов Wallbash, exec, pkill -x rofi || $scrPath/wallbashtoggle.sh -m
bindd = $mainMod Shift, T, $d Выбрать тему оформления HyDE, exec, pkill -x rofi || $scrPath/themeselect.sh
bindd = $mainMod Shift, Y, $d Выбрать стиль анимаций окон, exec, pkill -x rofi || $scrPath/animations.sh --select
bindd = $mainMod Shift, U, $d Выбрать лейаут экрана блокировки Hyprlock, exec, pkill -x rofi || $scrPath/hyprlock.sh --select


# ==============================================================================
# 📑 УПРАВЛЕНИЕ РАБОЧИМИ СТОЛАМИ (Workspaces)
# ==============================================================================
$ws = Рабочие столы

$d = [$ws|Навигация по столам]
bindd = $mainMod, 1, $d Перейти на рабочий стол 1, workspace, 1
bindd = $mainMod, 2, $d Перейти на рабочий стол 2, workspace, 2
bindd = $mainMod, 3, $d Перейти на рабочий стол 3, workspace, 3
bindd = $mainMod, 4, $d Перейти на рабочий стол 4, workspace, 4
bindd = $mainMod, 5, $d Перейти на рабочий стол 5, workspace, 5
bindd = $mainMod, 6, $d Перейти на рабочий стол 6, workspace, 6
bindd = $mainMod, 7, $d Перейти на рабочий стол 7, workspace, 7
bindd = $mainMod, 8, $d Перейти на рабочий стол 8, workspace, 8
bindd = $mainMod, 9, $d Перейти на рабочий стол 9, workspace, 9
bindd = $mainMod, 0, $d Перейти на рабочий стол 10, workspace, 10

$d = [$ws|Навигация по столам|Относительные столы]
bindd = $mainMod Control, Right, $d Переключить на следующий рабочий стол, workspace, r+1
bindd = $mainMod Control, Left, $d Переключить на предыдущий рабочий стол, workspace, r-1

$d = [$ws|Навигация по столам]
bindd = $mainMod Control, Down, $d Перейти на ближайший пустой рабочий стол, workspace, empty

# 📦 Перемещение окон на определенный рабочий стол
$d = [$ws|Перемещение окон на стол]
bindd = $mainMod Shift, 1, $d Переместить окно на рабочий стол 1, movetoworkspace, 1
bindd = $mainMod Shift, 2, $d Переместить окно на рабочий стол 2, movetoworkspace, 2
bindd = $mainMod Shift, 3, $d Переместить окно на рабочий стол 3, movetoworkspace, 3
bindd = $mainMod Shift, 4, $d Переместить окно на рабочий стол 4, movetoworkspace, 4
bindd = $mainMod Shift, 5, $d Переместить окно на рабочий стол 5, movetoworkspace, 5
bindd = $mainMod Shift, 6, $d Переместить окно на рабочий стол 6, movetoworkspace, 6
bindd = $mainMod Shift, 7, $d Переместить окно на рабочий стол 7, movetoworkspace, 7
bindd = $mainMod Shift, 8, $d Переместить окно на рабочий стол 8, movetoworkspace, 8
bindd = $mainMod Shift, 9, $d Переместить окно на рабочий стол 9, movetoworkspace, 9
bindd = $mainMod Shift, 0, $d Переместить окно на рабочий стол 10, movetoworkspace, 10


# 🔄 Перемещение окон на соседние рабочие столы
$d = [$ws]
bindd = $mainMod Control Alt, Right, $d Переместить окно на следующий соседний стол, movetoworkspace, r+1
bindd = $mainMod Control Alt, Left, $d Переместить окно на предыдущий соседний стол, movetoworkspace, r-1

# 🖱️ Прокрутка рабочих столов колесиком мыши поверх пустого места
$d = [$ws|Навигация по столам]
bindd = $mainMod, mouse_down, $d Следующий рабочий стол (Колесико вниз), workspace, e+1
bindd = $mainMod, mouse_up, $d Предыдущий рабочий стол (Колесико вверх), workspace, e-1

# 📥 Специальный скрытый рабочий стол (Scratchpad / Карман для окон)
$d = [$ws|Навигация по столам|Специальный стол]
bindd = $mainMod Shift, S, $d Отправить активное окно в карман (Следовать за ним), movetoworkspace, special
bindd = $mainMod Alt, S, $d Отправить активное окно в карман Тихо остаться на месте, movetoworkspacesilent, special
bindd = $mainMod, S, $d Показать/скрыть карман с окнами (Scratchpad), togglespecialworkspace


# 🤫 "Тихий" перенос окон на рабочий стол (Окно улетает, фокус экрана не меняется)
$d = [$ws|Навигация по столам|Тихий перенос окон]
bindd = $mainMod Alt, 1, $d Перенести окно на стол 1 тихо, movetoworkspacesilent, 1
bindd = $mainMod Alt, 2, $d Перенести окно на стол 2 тихо, movetoworkspacesilent, 2
bindd = $mainMod Alt, 3, $d Перенести окно на стол 3 тихо, movetoworkspacesilent, 3
bindd = $mainMod Alt, 4, $d Перенести окно на стол 4 тихо, movetoworkspacesilent, 4
bindd = $mainMod Alt, 5, $d Перенести окно на стол 5 тихо, movetoworkspacesilent, 5
bindd = $mainMod Alt, 6, $d Перенести окно на стол 6 тихо, movetoworkspacesilent, 6
bindd = $mainMod Alt, 7, $d Перенести окно на стол 7 тихо, movetoworkspacesilent, 7
bindd = $mainMod Alt, 8, $d Перенести окно на стол 8 тихо, movetoworkspacesilent, 8
bindd = $mainMod Alt, 9, $d Перенести окно на стол 9 тихо, movetoworkspacesilent, 9
bindd = $mainMod Alt, 0, $d Перенести окно на стол 10 тихо, movetoworkspacesilent, 10


# 🧹 Очистка контекста группы
$d = #! Сброс имени группы для последующих биндов

