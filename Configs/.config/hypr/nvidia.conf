# ==============================================================================
#           КОНФИГУРАЦИЯ И ОПТИМИЗАЦИЯ ДЛЯ ВИДЕОКАРТ NVIDIA (HyDE)
# ==============================================================================
# Официальное руководство: https://wiki.hyprland.org/Nvidia/
#
# Настройки в этом файле критически важны для стабильной работы интерфейса,
# устранения мерцаний, поддержки аппаратного ускорения и гладкой работы Ghostty.
# ==============================================================================

# 🚀 Драйверы и библиотеки аппаратного ускорения
# Заставляет библиотеки аппаратного декодирования (VA-API) использовать чип NVIDIA.
env = LIBVA_DRIVER_NAME,nvidia

# Указывает графической библиотеке GLX использовать проприетарный драйвер NVIDIA.
# ⚠️ Если у вас возникнут проблемы с демонстрацией экрана (Screensharing) в Discord,
# закомментируйте строку ниже (поставьте `#` в начале).
env = __GLX_VENDOR_LIBRARY_NAME,nvidia


# 🖱️ Настройка курсора мыши (Защита от мерцания и лагов)
# В Wayland на картах NVIDIA аппаратный курсор часто исчезает или мерцает.
# Мы принудительно включаем программный курсор (`true`), чтобы избежать лагов при смене формы курсора.
cursor:no_hardware_cursors = true

# Дополнительный хак (оставьте выключенным, если курсор работает нормально).
# Если включить (`true`), может вызывать микрофризы при изменении формы указателя.
# cursor:allow_dumb_copy = true


# 🎬 Аппаратное ускорение видео (VA-API) в Electron-приложениях
# Помогает запустить плавный рендеринг видео в Discord, VS Code, Chromium и т.д.
# ⚠️ ТРЕБУЕТСЯ: В системе должен быть установлен пакет `libva-nvidia-driver` (или `nvidia-vaapi-driver`).
# Раскомментируйте строку ниже, если пакет установлен:
# env = NVD_BACKEND,direct


# 🦊 Настройка бэкенда управления памятью (GBM)
# Обязательный параметр для работы современных драйверов NVIDIA в Wayland.
# ⚠️ Если Firefox начнет падать при запуске, удалите или закомментируйте эту строку.
env = GBM_BACKEND,nvidia-drm


# 🏎️ Дополнительные переменные для Vulkan и Терминала Ghostty
# Заставляет игры и тяжелые приложения на базе Vulkan API правильно определять видеокарту
env = WLR_RENDERER_ALLOW_SOFTWARE,0

# Принудительно запускает рендеринг Ghostty через Vulkan на твоей карте NVIDIA
env = GHOSTTY_RENDER_BACKEND,vulkan
