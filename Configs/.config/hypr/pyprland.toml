# ==============================================================================
#          КОНФИГУРАЦИЯ РАСШИРЕНИЯ PYPRLAND (ПЛАГИНЫ И SCRATCHPADS)
# ==============================================================================
# Официальная документация проекта: https://github.io
# Полный список доступных плагинов: https://github.ioPlugins.html
# ==============================================================================

[pyprland]
    # Список активированных плагинов. Включен "scratchpads" (выпадающие окна).
    plugins = [ "scratchpads" ]

[pyprland.variables]
    # 🏎️ ПЕРЕМЕННАЯ ДЛЯ ЭМУЛЯТОРА ТЕРМИНАЛА GHOSTTY
    # Шаблон запускает Ghostty и жестко присваивает окну класс "console-dropdown".
    # В Ghostty класс задается через `--class=имя`
    term_with_class = "ghostty --class=console-dropdown"


# 📥 НАСТРОЙКА ВЫПАДАЮЩЕГО ТЕРМИНАЛА (Кличка окна: console)
[scratchpads.console]
    # Стиль анимации появления окна. 
    # Варианты: "fromTop" (сверху), "fromBottom" (снизу), "fromLeft", "fromRight".
    animation = "fromTop"
    
    # Класс окна, по которому Pyprland отлавливает этот процесс в системе.
    class     = "console-dropdown"
    
    # Команда для старта приложения. Подставляет переменную Ghostty из блока выше.
    command   = "[term_with_class]"
    
    # Максимальный размер окна в процентах от разрешения экрана.
    max_size  = "90% 100%"
    
    # Стандартный стартовый размер окна (75% ширины экрана, 60% высоты).
    size      = "75% 60%"
