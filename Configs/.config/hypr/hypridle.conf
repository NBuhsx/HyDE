# ==============================================================================
#          НАСТРОЙКА РЕЖИМА ОЖИДАНИЯ И ЭНЕРГОСБЕРЕЖЕНИЯ (HYPRIDLE)
# ==============================================================================
# Официальная документация проекта: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# Файл управляет автоматизацией при бездействии пользователя:
# Приглушение яркости -> Блокировка -> Отключение экранов -> Сон.
# ==============================================================================

#!      ░▒▒▒░░░▓▓           ___________
#!    ░░▒▒▒░░░░░▓▓        //___________/
#!   ░░▒▒▒░░░░░▓▓     _   _ _    _ _____
#!   ░░▒▒░░░░░▓▓▓▓▓ | | | | |  | |  __/
#!    ░▒▒░░░░▓▓   ▓▓ | |_| | |_/ /| |___
#!     ░▒▒░░▓▓   ▓▓   \__  |____/ |____/
#!       ░▒▓▓   ▓▓  //____/

# 🔒 Команда блокировки экрана по умолчанию в экосистеме HyDE
$LOCKSCREEN = hyde-shell lockscreen

# // --- Глобальные настройки гибернации и сигналов ---
general {
    # Регистрирует команду блокировки в системной шине D-Bus.
    # Это позволяет заблокировать экран стандартной командой `loginctl lock-session`.
    lock_cmd = $LOCKSCREEN 
    
    # Автоматически блокирует сессию прямо перед тем, как компьютер уйдет в сон (закрытие крышки/suspend).
    # Защищает систему от ситуации, когда после пробуждения рабочий стол на секунду виден до включения блокировщика.
    before_sleep_cmd = loginctl lock-session    
    
    # Игнорировать запросы приложений на запрет сна через D-Bus (false = уважать запросы).
    # Если стоит false, то при просмотре видео на YouTube или в VLC экран гаснуть НЕ БУДЕТ.
    ignore_dbus_inhibit = false             
    ignore_systemd_inhibit = false          
}

# // --- 1. Приглушение яркости экрана через 60 секунд бездействия ---
listener {
    timeout = 60 # Время в секундах
    # brightnessctl -s сохраняет текущую яркость, а s 1% опускает её до минимума.
    on-timeout = { brightnessctl -s && brightnessctl s 1% ;} 
    # При первом движении мыши или нажатии клавиши возвращает яркость обратно.
    on-resume = brightnessctl -r 
}

# // --- 2. Автоматическая блокировка экрана через 10 минут (600 секунд) ---
listener {
    timeout = 600
    # Отправляет сигнал блокировки. Сработает наш $LOCKSCREEN (Hyprlock).
    on-timeout = loginctl lock-session 
}

# // --- 3. Полное отключение мониторов (DPMS) через 30 minutes (1800 секунд) ---
listener {
    timeout = 1800
    # Отключает подачу видеосигнала на BenQ и Xiaomi (они уходят в режим ожидания No Signal).
    on-timeout = hyprctl dispatch dpms off 
    # Включает мониторы обратно, как только пользователь проявит активность.
    on-resume = hyprctl dispatch dpms on   
}

# // --- 4. Отправка компьютера в глубокий сон через 1 час (3600 секунд) ---
listener {
    timeout = 3600
    # Переводит операционную систему в режим приостановки работы (Suspend to RAM).
    on-timeout = systemctl suspend 
}

# // --- Подключение кастомных обработчиков ---
# hyprlang noerror true
# Позволяет подгружать дополнительные файлы конфигурации ожидания из папки ./hypridle/
# На данный момент команда source с масками в hyprlang находится в стадии доработки, 
# но заготовка оставлена разработчиками HyDE для будущих обновлений.
source = ./hypridle/*
# hyprlang noerror false
