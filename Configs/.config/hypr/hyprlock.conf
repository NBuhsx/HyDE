# ******************************************************************************
#                  КОНФИГУРАЦИЯ ЭКРАНА БЛОКИРОВКИ HYPRLOCK (HyDE)
# ******************************************************************************
# Пожалуйста, не редактируйте логику отрисовки интерфейса в этом файле вручную.
# Используйте переменные ниже для смены стилей оформления (лейаутов).
# ******************************************************************************

# 📐 Выбор визуального стиля (Лейаута)
# Задает тему оформления для экрана блокировки. 
# Доступные темы можно найти в директории `~/.config/hypr/hyprlock/`
$LAYOUT_PATH = /home/serg/.config/hypr/hyprlock/SF Pro.conf

# ⚠️ ВАЖНОЕ ЗАМЕЧАНИЕ О ПРИОРИТЕТЕ:
# Если в глобальном файле `~/.config/hypr/hyde.conf` объявлен постоянный путь 
# к лейауту, то переменная `$LAYOUT_PATH` выше будет проигнорирована.
# Глобальный конфиг имеет высший приоритет.

# 🔄 Подключение базового движка HyDE
# Этот файл подгружает все системные шаблоны и заготовки, управляемые экосистемой.
source = /home/serg/.local/share/hypr/hyprlock.conf


# ==============================================================================
# 🎨 ШПАРГАЛКА: КАК СОЗДАТЬ СВОЙ СТИЛЬ (CUSTOM LAYOUT)
# ==============================================================================
# 1. Создайте свой файл конфигурации в папке `.hyprlock`
#    Пример: `~/.config/hypr/hyprlock/my_cool_theme.conf`
# 2. Чтобы включить его, измените переменную выше:
#    `$LAYOUT_PATH = /home/serg/.config/hypr/hyprlock/my_cool_theme.conf`
# 3. Новый стиль применится автоматически при следующей блокировке.
# ==============================================================================


# ==============================================================================
# 🛠️ СЛУЖЕБНЫЕ ПЕРЕМЕННЫЕ HyDE ДЛЯ ПЕРСОНАЛИЗАЦИИ ИНТЕРФЕЙСА
# ==============================================================================
# Вы можете использовать эти переменные внутри файлов лейаутов (например, в SF Pro.conf):
#
#   $BACKGROUND_PATH     - Динамический путь к текущим обоям рабочего стола.
#   $HYPRLOCK_BACKGROUND - Путь к статической картинке для экрана блокировки.
#                          (Задайте, если хотите, чтобы обои на блоке не менялись с рабочим столом).
#
#   $PROFILE_IMAGE       - Путь к аватарке пользователя. Если файла нет, проверит `~/.face.icon`.
#                          Если и его нет — отобразит логотип HyDE.
#   $MPRIS_IMAGE         - Обложка трека из медиаплеера. Если плеер пуст — покажет аватарку или лого.
#
#   $GREET_TEXT          - Текст приветствия (обновляется каждый час в зависимости от времени суток).
#   $resolve.font        - Скрипт автоматического скачивания шрифтов. HyDE сам скачает нужный шрифт
#                          при наличии интернета (требуется перезапуск Hyprlock для применения).
#
# 📊 Динамические команды (Обновление в реальном времени):
#
#   cmd [update:1000] $MPRIS_TEXT  - Выводит текущий трек в формате "Название  Автор" (каждую секунду).
#   cmd [update:1000] $SPLASH_CMD  - Выводит название трека, а если музыка не играет — цитату/сплэш.
#   cmd [update:5000] $BATTERY_ICON - Иконка состояния батареи (обновляется каждые 5 секунд).
#
#   ⚠️ cmd [update:1] $CAVA_CMD     - УСТАРЕЛО. Визуализатор CAVA на экране блока. 
#                                    Не рекомендуется использовать, сильно грузит процессор!
# ==============================================================================
