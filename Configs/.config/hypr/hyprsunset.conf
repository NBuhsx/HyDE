# ==============================================================================
#           КОНФИГУРАЦИЯ ФИЛЬТРА СИНЕГО ЦВЕТА И ГАММЫ (HYPRSUNSET)
# ==============================================================================
# Документация утилиты: https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/
#
# Как это работает: При запуске утилита проверяет текущее время и активирует
# подходящий профиль. Переключение между профилями происходит автоматически.
# ==============================================================================

# 📊 Максимальный лимит гаммы (яркости)
# Задает верхний предел регулировки гаммы в процентах (максимум — 200).
# Полезно для ограничения яркости при управлении фильтром через горячие клавиши.
max-gamma = 150

# ☀️ Дневной профиль: Возвращает экран к родной цветопередаче монитора
profile {
    time = 06:00
    
    # Режим "Идентичность" игнорирует температуру и оставляет цвета чистыми.
    # Экран будет показывать стандартные 6000K-6500K без желтизны.
    identity = true
}

# 🌙 Ночной профиль: Накладывает теплый фильтр и снижает интенсивность света
profile {
    time = 21:00
    
    # Цветовая температура в Кельвинах (чем ниже число, тем "теплее" и желтее экран).
    # Стандартное комфортное ночное значение: 4500-5500.
    temperature = 5500
    
    # Программная гамма (воспринимаемая яркость). Позволяет опустить яркость
    # экрана даже ниже физического минимума, поддерживаемого вашим монитором.
    # 1.0 — стандарт, 0.8 — слегка приглушенный свет.
    gamma = 0.8
}
