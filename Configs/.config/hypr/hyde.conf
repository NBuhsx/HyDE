# 🌍 СИСТЕМНЫЕ ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ (Environment Variables)

# 🛠️ Переменные графических бэкендов (Борьба со старым X11 софтом)
$env.GDK_BACKEND = wayland,x11,*        # GTK: приоритет Wayland, при ошибке — X11.
# $env.QT_QPA_PLATFORM = wayland;xcb     # Qt: приоритет Wayland, откат на X11.
$env.SDL_VIDEODRIVER = wayland          # Запуск игр на SDL2 напрямую в Wayland.
$env.CLUTTER_BACKEND = wayland          # Форсирует использование Wayland в Clutter приложениях.

# 🗺️ Спецификации XDG для корректной работы скриншотов, записи экрана и порталов
$env.XDG_CURRENT_DESKTOP = Hyprland
$env.XDG_SESSION_TYPE = wayland
$env.XDG_SESSION_DESKTOP = Hyprland

# 🎨 Настройки интеграции тем для Qt приложений (Kvantum, VLC, Dolphin)
$env.QT_AUTO_SCREEN_SCALE_FACTOR = 1    # Автоматическое масштабирование элементов под PPI монитора.
$env.QT_QPA_PLATFORM = wayland;xcb
$env.QT_WAYLAND_DISABLE_WINDOWDECORATION = 1 # Отключает лишние рамки окон в Qt приложениях.
$env.QT_QPA_PLATFORMTHEME = qt6ct            # Указывает Qt6 приложениям брать тему оформления из qt6ct.

# 🏎️ Специфичные переменные окружения HyDE
$env.PATH =
$env.MOZ_ENABLE_WAYLAND = 1              # Принудительный запуск Firefox в чистом режиме Wayland.
$env.GDK_SCALE = 1                       # Масштаб GDK для корректного отображения XWayland окон.
$env.ELECTRON_OZONE_PLATFORM_HINT = auto # Авто-выбор бэкенда для приложений на Electron (Discord, VS Code).

# 📂 Глобальные системные пути XDG-директорий
$env.XDG_RUNTIME_DIR = $XDG_RUNTIME_DIR
$env.XDG_CONFIG_HOME = $HOME/.config
$env.XDG_CACHE_HOME = $HOME/.cache
$env.XDG_DATA_HOME = $HOME/.local/share


