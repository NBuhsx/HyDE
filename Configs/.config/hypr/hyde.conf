# ==============================================================================
#          ГЛОБАЛЬНЫЙ ФАЙЛ ПЕРЕОПРЕДЕЛЕНИЙ ПЕРЕМЕННЫХ И АВТОЗАПУСКА (HyDE)
# ==============================================================================
# ⚠️ ВНИМАНИЕ: Никогда не подключайте этот файл через `source` в hyprland.conf напрямую!
# Главный файл конфигурации Hyprland сам подгружает его в нужный момент.
# 
# ПРАВИЛА СИНТАКСИСА:
# - Оставить переменную пустой (например, `$VAR = `) — полностью сбросит её.
# - Закомментировать переменную (`#`) — вернет её стандартное системное значение.
# - Этот файл принимает ТОЛЬКО знак `$` для переменных и `#` для комментариев.
# ==============================================================================

