# ==============================================================================
#            ЛИЧНЫЕ ПОЛЬЗОВАТЕЛЬСКИЕ НАСТРОЙКИ (USER PREFERENCES)
# ==============================================================================
# Официальная документация: https://wiki.hyprland.org/Configuring/Variables/
#
# Этот файл имеет НАИВЫСШИЙ приоритет загрузки. Все параметры, указанные здесь,
# переопределяют стандартные настройки HyDE. Пишите сюда всё, что хотите изменить.
# ==============================================================================

# // ⌨️ ВХОДНЫЕ УСТРОЙСТВА (Клавиатура, Мышь, Тачпад)
# 🔗 Подробнее: https://wiki.hyprland.org/Configuring/Variables/#input
input {
    # 🌍 Раскладки клавиатуры. Добавлены английская (us) и русская (ru).
    kb_layout = us, ru
    kb_variant =
    kb_model =
    
    # 🔄 Горячая клавиша для переключения языка (в данном случае Alt + Shift).
    # Другие популярные варианты: grp:win_space_toggle (Super+Пробел), grp:caps_toggle (Caps Lock).
    kb_options = grp:alt_shift_toggle
    kb_rules =

    # 🖱️ Поведение фокуса мыши
    # 1 — Окно получает фокус, как только на него наводится курсор мыши.
    # 0 — Для фокуса нужно кликнуть по окну.
    # 2 — Фокус строго за курсором, мышь не делит окна при переключении клавиатурой.
    follow_mouse = 1

    # 🎯 Чувствительность мыши (ускорение курсора)
    # Диапазон: от -1.0 до 1.0. Значение 0 означает отсутствие изменений (родная скорость).
    sensitivity = 0 

    # 🔗 Подробнее: https://wiki.hyprland.org/Configuring/Variables/#touchpad
    touchpad {
        # 📜 Направление прокрутки тачпада
        # no  — Стандартное (тянешь пальцы вниз — страница едет вверх).
        # yes — Инвертированное/Натуральное (как на смартфонах или macOS).
        natural_scroll = no
    }
}


# // 🖐️ ЖЕСТЫ ТАЧПАДА (Для ноутбуков)
# 🔗 Подробнее: https://hyprland.org
gestures {
    # 🔄 Свайп по тачпаду для переключения рабочих столов (Воркспейсов).
    # Раскомментируйте (уберите `#`), если используете ноутбук:
    # workspace_swipe = true
    
    # Количество пальцев для активации свайпа (обычно 3 или 4).
    # workspace_swipe_fingers = 3
}
# ==============================================================================
# 🚀 АВТОЗАПУСК: 1 - БРАУЗЕР (СЛЕВА), 2 - РЕДАКТОР (СПРАВА), 3 - ТЕРМИНАЛ (СЛЕВА)
# ==============================================================================
# 1️⃣ Категория 1: Браузер — на Воркспейс 1 (Левый экран, открыт сразу)
exec-once = [workspace 1] $BROWSER
# 2️⃣ Категория 2: Редактор ($IDLE) — на Воркспейс 2 (Правый экран, открыт сразу)
exec-once = [workspace 2] $IDLE
# 3️⃣ Категория 3: Терминал Ghostty — на Воркспейс 3 (Левый экран, скрыт за браузером)
exec-once = [workspace 3] $TERMINAL